name: Android Build

# Builds the Minis Android APK, including the native PRoot sandbox and the
# Alpine rootfs assets. Produces debug + release (debug-signed) artifacts.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with native submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;28.0.12433566" "cmake;3.22.1" "platforms;android-24" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Build-time customization (defaults)
        # The public mirror ships only the .example template; CI builds with
        # empty customization values (API-key sign-in and Gemini OAuth work;
        # only Claude-OAuth system-prompt identification needs a real value).
        working-directory: src/android
        run: |
          if [ ! -f app/provider-customization.properties ]; then
            cp app/provider-customization.properties.example app/provider-customization.properties
          fi

      - name: Build native sandbox dependencies
        # Cross-compiles the OpenMinis PRoot fork with the NDK and installs
        # it into app assets + jniLibs (libproot.so + verified loaders).
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Install zig (musl cross compiler for netguard shim)
        # The shim is LD_PRELOADed into Alpine MUSL python3 inside the guest.
        # An NDK/bionic build fails relocation there and kills every plugin
        # spawn (verified 2026-09-08). musl.cc is flaky (curl exit 28) — use
        # zig cc with the aarch64-linux-musl target instead (reliable host).
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xzf zig.tar.xz
          printf '#!/bin/sh\nexec %s/zig cc -target aarch64-linux-musl "$@"\n' "$PWD/zig-linux-x86_64-0.13.0" > /usr/local/bin/musl-cc
          chmod +x /usr/local/bin/musl-cc

      - name: Build netguard shim (LD_PRELOAD connect guard, musl)
        # Vendors minis-netguard.so into default_mount/usr/local/lib/minis/ so
        # the minis-mcp-cli daemon can arm it for plugin server spawns whose
        # manifest declares a network allowlist. See deps/build_netguard.sh.
        env:
          CC: /usr/local/bin/musl-cc
        run: |
          chmod +x deps/build_netguard.sh
          ./deps/build_netguard.sh

      - name: Set up Go (for rclone AAR)
        # rclone.aar is a build artifact (like libproot.so): produced from the
        # vendored deps/rclone-mobile gomobile binding via
        # deps/build_rclone_android.sh (arm64-v8a only, matching abiFilters).
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build rclone AAR (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar

      - name: Prepare Alpine rootfs asset
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Gradle wrapper permissions
        working-directory: src/android
        run: chmod +x gradlew

      - name: Build APKs (debug + release)
        working-directory: src/android
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
